name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run static checks
        run: go vet ./...

  build-windows:
    name: Build Windows executable
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile Windows x64 executable
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -buildvcs=false -trimpath -ldflags="-s -w" -o dist/lease-platform.exe ./cmd/server

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: lease-platform-windows-amd64
          path: dist/lease-platform.exe
          if-no-files-found: error
          retention-days: 14
